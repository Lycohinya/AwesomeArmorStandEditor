# AwesomeArmorStandEditor — 設定
# 玩家可見文字在 lang/<語言代碼>.yml。此檔只放行為/效能常數,可用 /aase reload 重載。

# 語言(全服一種)。auto = 看伺服器 JVM 的地區設定:中文語系→zh_TW,其餘→en。
# 也可以直接寫 zh_TW 或 en。啟用後對應的 lang/<代碼>.yml 會複製到本資料夾,可自行編輯。
language: auto

tool:
  # 編輯工具的物品材質(Bukkit Material 名稱)
  material: BLAZE_ROD
  # 拿工具操作時是否有音效反饋
  sound: true
  # 用 /aase edit 綁定既有作品時,搜尋附近元件的範圍(格)
  select-range: 6

# 每次點擊調整的步進;每種模式一組,滾輪在其中循環
steps:
  rotation-deg: [1.0, 15.0, 45.0]   # 姿勢 / 旋轉(度)
  translate: [0.1, 0.5, 1.0]        # 移動 / 平移(格)
  scale: [0.1, 0.25, 1.0]           # 縮放

# 數量上限(記憶體計數,超限拒絕放置)。bypass 權限:aase.bypass.limit
limits:
  per-player: 200
  global: 5000
  per-chunk: 100

region:
  # true = 放置/編輯前模擬一次保護事件,尊重 GriefPrevention/WorldGuard/Towny/Lands 等領地插件
  # false = 不檢查領地(僅靠權限與擁有權)。bypass 權限:aase.bypass.region
  event-probe: true

# 粒子發射器(/aase particle):只在已載入區塊 + 附近有玩家時發射,並有每 tick 全域上限
particles:
  budget-per-tick: 200   # 每 tick 全服最多實際發射的發射器數(超過就跳過,保護 TPS);Folia 各區域同時發射,上限為近似值
  render-range: 32       # 發射器周圍多少格內有玩家才發射(Folia 上只算同一區域內的玩家)

# 管理工具(/aase admin,權限 aase.admin)
admin:
  # /aase admin purge <半徑> 的最大半徑(格);超過會被夾到這個值。
  # 只會清除「本插件放置」且「在已載入區塊內」的元件,不會碰玩家手放的原版盔甲座。
  max-purge-radius: 64


# 場景存檔格式(/aase save 寫出的 scenes/*.json)
store:
  # 3 = 新格式(預設):姿勢用度數 poseDeg、物品用 ItemRef {id, count, components, bukkit},可直接在擺景亭編輯
  # 2 = 舊格式:姿勢用弧度、物品只存 Bukkit base64,給還在用 1.2.x 以前版本的伺服器讀
  #     (只有 id 沒有 base64 的物品會先在伺服器上轉成物品再存;轉不出來的欄位會省略並寫警告到主控台)
  # 兩種格式插件都讀得懂,切換不需要轉檔
  write-schema: 3

# 遠端匯入:/aase import <短碼|網址> 從擺景亭下載作品
# 插件只會主動對外連線(HTTPS),不會開任何監聽 port
import:
  remote:
    # false = 整條遠端路徑關閉(不建立連線、不開執行緒),/aase import 短碼 會回「此伺服器未開放遠端匯入」
    # 分享碼文字(AASE1:…)不受影響
    enabled: true
    # 擺景亭的網址。只允許 https;http 只限 localhost / 127.0.0.1(本機測試用)
    base-url: "https://lyco-aase.tinyyana.com"
    # 連線與等待回應的逾時(秒)
    timeout-seconds: 10
    # 下載的作品檔最大位元組數,超過就中止(預設 1 MiB)
    max-bytes: 1048576
    # 每位玩家兩次遠端匯入/上傳之間至少間隔幾秒
    cooldown-seconds: 10
    # 全服同時進行的下載/上傳上限
    max-concurrent: 4

share:
  # true = /aase share 先上傳到擺景亭取得短碼(需要 import.remote.enabled: true);
  #        上傳失敗時自動改給分享碼文字
  # false = 只給分享碼文字(點擊複製,提示貼到擺景亭或存成檔案)
  # 上傳前會去掉擁有者、場景 id、最後放置位置
  upload: true
